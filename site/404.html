<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>没有这个页面</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b1220'/%3E%3Cpath d='M9 21V11h3.2l3.8 6 3.8-6H23v10h-2.6v-5.6L17 20h-2l-3.4-4.6V21z' fill='%23e8eefc'/%3E%3C/svg%3E">
<style>
  :root{ --bg:#f6f8fc; --fg:#101828; --dim:#5a6b88; --accent:#2456d6; }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0b1220; --fg:#e8eefc; --dim:#93a4c6; --accent:#8fb0ff; }
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; display:grid; place-items:center;
    background:var(--bg); color:var(--fg); padding:32px;
    font:16px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",
         "PingFang SC","Microsoft YaHei",sans-serif;
  }
  .box{ max-width:26rem; text-align:center; }
  .code{ font-size:clamp(3rem,14vw,5rem); font-weight:700; line-height:1;
         letter-spacing:-.03em; color:var(--dim); opacity:.45; margin:0; }
  h1{ font-size:1.15rem; margin:1rem 0 .5rem; }
  p{ margin:0; color:var(--dim); font-size:.94rem; }
  a{ color:var(--accent); text-decoration:none; border-bottom:1px solid currentColor; }
  a:hover{ opacity:.8; }
</style>
</head>
<body>
  <div class="box">
    <p class="code">404</p>
    <h1>这里没有东西</h1>
    <p>地址打错了，或者那个东西还没放上来。<br><a href="/">回汇总页</a></p>
  </div>
</body>
</html>
